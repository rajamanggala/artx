.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);transition:opacity .45s ease,backdrop-filter .45s ease,-webkit-backdrop-filter .45s ease,visibility 0s linear .45s}

.modal-box{position:relative;width:min(460px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:#000;border:1px solid rgba(255,255,255,.14);border-top:3px solid var(--red);border-radius:var(--r);padding:40px 26px 28px;opacity:0;transform:translateY(28px) scale(.96);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .45s ease}

.pre-in .ring-a{inset:0;animation:preSpin 1.6s linear infinite}
.pre-in .ring-b{inset:9%;width:82%;height:82%;animation:preSpinRev 2.2s linear infinite}

.ring-b circle{stroke:rgba(255,255,255,.85);stroke-width:2;stroke-dasharray:70 232}

<script>
(function(){
  var sheet=document.getElementById("sheet");
  document.getElementById("open").onclick=function(){sheet.classList.add("open")};
  document.getElementById("close").onclick=function(){sheet.classList.remove("open")};

  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var saver=navigator.connection&&navigator.connection.saveData;
  var vid=document.getElementById("bg");
  if(saver||reduce){vid.removeAttribute("autoplay");vid.pause();[].forEach.call(vid.querySelectorAll("source"),function(x){x.removeAttribute("src")});vid.load()}
  var srcs=vid.querySelectorAll("source");function hideVid(){vid.style.display="none"}
  srcs[srcs.length-1].addEventListener("error",hideVid);vid.addEventListener("error",hideVid);

})();
</script>
<script>
(function(){
  var pre=document.getElementById("pre"),vid=document.getElementById("bg");
  var start=performance.now(),MIN=1400,MAX=6000,finished=false,pageOk=false,vidOk=false;
  var skipVid=(navigator.connection&&navigator.connection.saveData)||matchMedia("(prefers-reduced-motion: reduce)").matches;

  function finish(){
    if(finished)return;finished=true;
    var wait=Math.max(0,MIN-(performance.now()-start));
    setTimeout(function(){
      pre.classList.add("done");
      document.body.classList.remove("loading");
      setTimeout(function(){pre.remove()},900);
    },wait);
  }
  function check(){if(pageOk&&vidOk)finish()}

  if(document.readyState==="complete")pageOk=true;
  else addEventListener("load",function(){pageOk=true;check()});

  if(skipVid||vid.readyState>=3)vidOk=true;
  else{
    ["canplay","loadeddata","error"].forEach(function(ev){
      vid.addEventListener(ev,function(){vidOk=true;check()});
    });
  }
  check();
  setTimeout(finish,MAX);
})();
</script>
