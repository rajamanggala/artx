<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media – ARTAXIAD</title>
<meta name="description" content="Foto dan dokumentasi ARTAXIAD.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{--black:#000;--red:#D62420;--white:#fff;--r:24px;--font:"Martian Mono",ui-monospace,Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--black);color:var(--white);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.vp{position:fixed;inset:0;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.stage{position:relative;width:100%;height:100%;border-radius:var(--r);background:radial-gradient(ellipse at 30% 70%,#4a0d0b,#000 65%)}
.stage>video{position:absolute;inset:0;width:100%;height:100%}
.stage>video{object-fit:cover}
.stage>video{border-radius:var(--r)}
/* tab hitam yang menyatu dengan bingkai */
.tab{position:absolute;background:var(--black);z-index:5}
.tab::before,.tab::after{content:"";position:absolute;pointer-events:none}
/* lengkungan dibuat +1px & menumpuk ke tab supaya tidak ada garis tipis */
.tl{top:0;left:0;border-bottom-right-radius:var(--r);padding:12px 16px 16px 12px}
.tl::before{left:calc(100% - 1px);top:0;width:calc(var(--r) + 1px);height:var(--r)}
.tl::after{left:0;top:calc(100% - 1px);width:var(--r);height:calc(var(--r) + 1px)}
.tl::before,.tl::after{background:radial-gradient(circle at 100% 100%,transparent var(--r),var(--black) calc(var(--r) + .5px))}
.tr{top:0;right:0;border-bottom-left-radius:var(--r);padding:26px 32px 28px 36px}
.tr::before{right:calc(100% - 1px);top:0;width:calc(var(--r) + 1px);height:var(--r)}
.tr::after{right:0;top:calc(100% - 1px);width:var(--r);height:calc(var(--r) + 1px)}
.tr::before,.tr::after{background:radial-gradient(circle at 0 100%,transparent var(--r),var(--black) calc(var(--r) + .5px))}
.bl{bottom:0;left:0;border-top-right-radius:var(--r);padding:16px 18px 12px 14px;font-size:11px}
.bl::before{left:calc(100% - 1px);bottom:0;width:calc(var(--r) + 1px);height:var(--r)}
.bl::after{left:0;bottom:calc(100% - 1px);width:var(--r);height:calc(var(--r) + 1px)}
.bl::before,.bl::after{background:radial-gradient(circle at 100% 0,transparent var(--r),var(--black) calc(var(--r) + .5px))}
.br{bottom:0;right:0;border-top-left-radius:var(--r);padding:16px 18px 12px 24px;font-size:11px;display:flex;gap:18px}
.br::before{right:calc(100% - 1px);bottom:0;width:calc(var(--r) + 1px);height:var(--r)}
.br::after{right:0;bottom:calc(100% - 1px);width:var(--r);height:calc(var(--r) + 1px)}
.br::before,.br::after{background:radial-gradient(circle at 0 0,transparent var(--r),var(--black) calc(var(--r) + .5px))}
.br a:hover{color:var(--red)}
.logo{display:block;width:84px;height:84px;object-fit:contain}
.menu{display:flex;gap:32px;margin:0;padding:0;list-style:none;font-size:16px;text-transform:uppercase}
.menu a{padding:6px 0;border-bottom:3px solid transparent;transition:border-color .2s}
.menu a:hover,.menu a[aria-current="page"]{border-color:var(--red)}
.burger{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:44px;height:44px;padding:0;background:none;border:0;cursor:pointer}
.burger span{display:block;width:26px;height:2px;background:var(--white);border-radius:2px}
.sheet{position:fixed;inset:0;z-index:30;background:var(--black);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 10vw;transform:translateX(-100%);visibility:hidden;transition:transform .55s cubic-bezier(.77,0,.18,1),visibility 0s linear .55s}
.sheet.open{transform:translateX(0);visibility:visible;transition:transform .55s cubic-bezier(.77,0,.18,1),visibility 0s}
.sheet a{font:700 clamp(28px,9vw,44px)/1.25 var(--font)}
.sheet a:hover,.sheet a[aria-current="page"]{color:var(--red)}
.sheet button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);right:24px;background:none;border:1px solid rgba(255,255,255,.4);color:var(--white);border-radius:99px;height:34px;padding:0 16px;font:400 11px var(--font);cursor:pointer}
/* hero */
.hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 16px}
.hero h1{margin:0;line-height:0;animation:in 1.6s cubic-bezier(.2,.7,.2,1) both}
.hero h1 img{display:block;width:clamp(280px,70vw,1020px);height:auto;margin:0 auto;filter:drop-shadow(0 4px 40px rgba(0,0,0,.45))}
@keyframes in{from{opacity:0;filter:blur(24px)}to{opacity:1;filter:blur(0)}}
/* tombol */
.pill{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 22px;border-radius:99px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--white);font:400 12px var(--font);text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
.pill:hover{background:var(--white);color:var(--black)}
.pill.red{background:var(--red);border-color:var(--red)}
.pill.red:hover{background:var(--white);border-color:var(--white);color:var(--black)}
.cta{position:absolute;right:20px;bottom:64px;display:flex;gap:12px;z-index:3}
.card{position:absolute;left:20px;bottom:64px;z-index:3;width:min(350px,calc(100% - 40px));display:flex;gap:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.cover{flex:none;display:block;width:78px;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#000}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.card small{display:block;margin:4px 0 8px;font-size:10px;line-height:1.45;opacity:.85}
.card .pill{height:30px;padding:0 16px;font-size:10px}

/* popup follow */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);transition:opacity .45s ease,backdrop-filter .45s ease,-webkit-backdrop-filter .45s ease,visibility 0s linear .45s}
.modal.open{opacity:1;visibility:visible;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .45s ease,backdrop-filter .45s ease,-webkit-backdrop-filter .45s ease,visibility 0s}
.modal-box{position:relative;width:min(460px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:#000;border:1px solid rgba(255,255,255,.14);border-top:3px solid var(--red);border-radius:var(--r);padding:40px 26px 28px;opacity:0;transform:translateY(28px) scale(.96);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .45s ease}
.modal.open .modal-box{opacity:1;transform:none}
.modal-x{position:absolute;top:12px;right:12px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:none;color:var(--white);cursor:pointer;transition:background .25s,border-color .25s,transform .35s}
.modal-x:hover{background:var(--red);border-color:var(--red);transform:rotate(90deg)}
.modal section+section{margin-top:28px}
.modal h2{margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.row{opacity:0;transform:translateY(14px);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1),background .25s,color .25s,border-color .25s}
.modal.open .row{opacity:1;transform:none;transition-delay:calc(.15s + var(--i) * .06s),calc(.15s + var(--i) * .06s),0s,0s,0s}
.modal.open .row:hover{transition-delay:0s}
.link{display:flex;align-items:center;gap:14px;height:52px;padding:0 18px;border:1px solid rgba(255,255,255,.22);border-radius:14px;font-size:12px;text-transform:uppercase}
.link i{width:20px;text-align:center;font-size:18px}
.link .go{width:auto;margin-left:auto;font-size:11px;opacity:.7}
.link:hover{background:var(--white);border-color:var(--white);color:var(--black)}
.link.main{background:var(--red);border-color:var(--red)}
.link.main:hover{background:var(--white);border-color:var(--white)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}

/* preloader */
.pre{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
.pre.done{opacity:0;visibility:hidden}
.pre-in{position:relative;width:clamp(220px,40vmin,340px);aspect-ratio:1;display:grid;place-items:center}
.pre-in img{width:60%;height:60%;object-fit:contain;animation:prePulse 3.2s cubic-bezier(.45,0,.55,1) infinite;will-change:transform,opacity}
.pre-in svg{position:absolute;width:100%;height:100%}
.pre-in .ring-a{inset:0;animation:preSpin 1.6s linear infinite}
.pre-in .ring-b{inset:9%;width:82%;height:82%;animation:preSpinRev 2.2s linear infinite}
.pre-in circle{fill:none;stroke-linecap:round}
.ring-a circle{stroke:var(--red);stroke-width:2.5;stroke-dasharray:110 192}
.ring-b circle{stroke:rgba(255,255,255,.85);stroke-width:2;stroke-dasharray:70 232}
@keyframes preSpin{to{transform:rotate(360deg)}}
@keyframes preSpinRev{to{transform:rotate(-360deg)}}
@keyframes prePulse{0%,100%{opacity:.7;transform:scale(.97)}50%{opacity:1;transform:scale(1.02)}}
.loading .hero h1{animation-play-state:paused}
@media(max-width:820px){
  .menu{display:none}.burger{display:flex}
  .tl,.tr{padding:0;display:flex;align-items:center;justify-content:center}
  .tl{width:64px;height:64px;padding:0 4px 4px 0}
  .tr{width:46px;height:42px;padding:0 0 3px 3px}
  .burger{width:34px;height:34px;gap:4px}
  .burger span{width:20px}
  .bl{font-size:9px;padding:14px 14px 10px 14px}
  .br{font-size:9px;gap:10px;padding:14px 14px 10px 18px}
  .cta{right:auto;left:50%;transform:translateX(-50%);top:auto;bottom:48px;gap:8px}
  .cta .pill{height:34px;padding:0 14px;font-size:10px}
  .logo{width:46px;height:46px}
  .card{bottom:92px;left:16px;width:min(320px,calc(100% - 32px))}
  .card .cover{width:64px;font-size:26px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== halaman Perform ===== */
.dim{position:absolute;inset:0;pointer-events:none;border-radius:var(--r);background:linear-gradient(to bottom,rgba(0,0,0,.68),rgba(0,0,0,.72) 50%,rgba(0,0,0,.82))}
.page{position:absolute;left:0;right:0;top:120px;bottom:62px;z-index:2;overflow-y:auto;overscroll-behavior:contain;padding:0 clamp(14px,2.4vw,36px) 28px;scrollbar-width:thin;scrollbar-color:var(--red) transparent;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%)}
.page::-webkit-scrollbar{width:6px}.page::-webkit-scrollbar-thumb{background:var(--red);border-radius:6px}
.page-head{margin:0 0 22px;padding-top:22px}
.page-head h1{margin:0 0 8px;font:700 clamp(28px,4vw,52px)/1 var(--font);text-transform:uppercase;letter-spacing:.02em}
.page-head p{margin:0;font-size:12px;line-height:1.6;opacity:.75;max-width:560px}
/* ===== Media: susunan masonry + popup detail ===== */
.list{display:flex;align-items:flex-start;gap:10px;padding:30px;background:#fff;border-radius:0}
.page-head,.list{max-width:1600px;margin-left:auto;margin-right:auto}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
.md{position:relative;display:block;width:100%;overflow:hidden;color:#fff;cursor:zoom-in;background:#000 url(img/circle-logo.png) center/14% auto no-repeat}
.md:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.md img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.md:hover img,.md:focus-visible img{transform:scale(1.05)}
.md .cap{position:absolute;left:0;right:0;bottom:0;padding:48px 16px 14px;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,0));opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.md:hover .cap,.md:focus-visible .cap{opacity:1;transform:none}
.md time{display:block;margin-bottom:4px;font:700 10px/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.md h2{margin:0;font:700 clamp(12px,1.1vw,16px)/1.25 var(--font);text-transform:uppercase}
.md .ex{position:absolute;top:12px;right:12px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--red);color:#fff;font-size:13px;opacity:0;transform:scale(.6);transition:opacity .3s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.md:hover .ex,.md:focus-visible .ex{opacity:1;transform:none}
.md .cnt{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);font:700 11px/1 var(--font)}
@media(hover:none){.md .cap{opacity:1;transform:none}.md .ex{display:none}}
@media(max-width:820px){.page{top:84px;bottom:58px}}
@media(max-width:600px){.list{gap:8px;padding:12px}.col{gap:8px}.md .cap{padding:32px 10px 9px}.md time{font-size:9px}.md h2{font-size:11px}}

/* popup detail foto */
.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);transition:opacity .4s ease,backdrop-filter .4s ease,-webkit-backdrop-filter .4s ease,visibility 0s linear .4s}
.lb.open{opacity:1;visibility:visible;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .4s ease,backdrop-filter .4s ease,-webkit-backdrop-filter .4s ease,visibility 0s}
.lb-box{position:relative;width:min(1120px,100%);height:min(760px,calc(100dvh - 40px));display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);background:#000;border:1px solid rgba(255,255,255,.14);border-top:3px solid var(--red);border-radius:var(--r);overflow:hidden;transform:translateY(24px) scale(.97);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.lb.open .lb-box{transform:none}
.lb-fig{position:relative;margin:0;min-height:0;background:#050505}
.lb-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s ease}
.lb-fig img.ld{opacity:0}
.lb-info{display:flex;flex-direction:column;min-height:0;overflow:auto;padding:48px 28px 24px}
.lb-no{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.lb-info time{display:block;margin-top:20px;font:700 11px/1.3 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.lb-info h2{margin:8px 0 14px;font:700 clamp(18px,2.2vw,26px)/1.2 var(--font);text-transform:uppercase}
.lb-info p{margin:0;font-size:12px;line-height:1.8;opacity:.85}
.lb-act{margin-top:auto;padding-top:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lb-act .pill{gap:10px;text-decoration:none}
.lb-nav{margin-left:auto;display:flex;gap:8px}
.lb-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:none;color:var(--white);cursor:pointer;transition:background .25s,border-color .25s}
.lb-btn:hover{background:var(--red);border-color:var(--red)}
.lb-x{position:absolute;top:12px;right:12px;z-index:3;background:rgba(0,0,0,.55);transition:background .25s,border-color .25s,transform .35s}
.lb-x:hover{transform:rotate(90deg)}
@media(max-width:760px){
  .lb{padding:10px}
  .lb-box{display:block;height:auto;max-height:calc(100dvh - 20px);overflow-y:auto}
  .lb-fig{height:min(58dvh,130vw)}
  .lb-info{overflow:visible;padding:22px 20px 20px}
  .lb-info time{margin-top:14px}
}
</style>
</head>

<script>
(function(){
  var sheet=document.getElementById("sheet");
  document.getElementById("open").onclick=function(){sheet.classList.add("open")};
  document.getElementById("close").onclick=function(){sheet.classList.remove("open")};

  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var saver=navigator.connection&&navigator.connection.saveData;
  var vid=document.getElementById("bg");
  if(saver||reduce){vid.removeAttribute("autoplay");vid.pause();[].forEach.call(vid.querySelectorAll("source"),function(x){x.removeAttribute("src")});vid.load()}
  var srcs=vid.querySelectorAll("source");function hideVid(){vid.style.display="none"}
  srcs[srcs.length-1].addEventListener("error",hideVid);vid.addEventListener("error",hideVid);

})();
</script>
<script>
(function(){
  var pre=document.getElementById("pre"),vid=document.getElementById("bg");
  var start=performance.now(),MIN=1400,MAX=6000,finished=false,pageOk=false,vidOk=false;
  var skipVid=(navigator.connection&&navigator.connection.saveData)||matchMedia("(prefers-reduced-motion: reduce)").matches;

  function finish(){
    if(finished)return;finished=true;
    var wait=Math.max(0,MIN-(performance.now()-start));
    setTimeout(function(){
      pre.classList.add("done");
      document.body.classList.remove("loading");
      setTimeout(function(){pre.remove()},900);
    },wait);
  }
  function check(){if(pageOk&&vidOk)finish()}

  if(document.readyState==="complete")pageOk=true;
  else addEventListener("load",function(){pageOk=true;check()});

  if(skipVid||vid.readyState>=3)vidOk=true;
  else{
    ["canplay","loadeddata","error"].forEach(function(ev){
      vid.addEventListener(ev,function(){vidOk=true;check()});
    });
  }
  check();
  setTimeout(finish,MAX);
})();
</script>

<script>
/* DATA MEDIA (ditulis manual). Nanti diganti data dari database (Laravel).
   img: path foto.  w, h: lebar dan tinggi foto dalam piksel (dipakai untuk menyusun grid, cukup perkiraan).
   d: tanggal (boleh dikosongkan).  t: judul.  s: keterangan di popup.
   u: link postingan Instagram (kosongkan kalau tidak ada; sementara mengarah ke profil).
   c: jumlah foto tambahan kalau satu postingan berisi banyak foto (tampil "+12"), isi 0 kalau cuma satu.
   Urutan di bawah ini = urutan tampil (sudah diatur supaya susunannya seimbang). */
(function(){
  var IG="https://www.instagram.com/artaxiadgamelan/";
  var MEDIA=[
    {d:"",t:"Foto Bersama di Panggung",s:"Personel ARTAXIAD berpose bersama di atas panggung, berbusana hitam dan merah dengan udeng bermotif batik.",img:"img/10.jpg",w:1080,h:766,c:0,u:IG},
    {d:"",t:"Saksofon dan Biola",s:"Pemain saksofon dan biola berbusana adat berjajar di panggung dalam bingkai hitam putih.",img:"img/5.jpg",w:890,h:594,c:0,u:IG},
    {d:"",t:"Khusyuk di Balik Kendang",s:"Seorang pemain memejamkan mata di balik gamelan dan kendang, dengan pemain bas berdiri di belakangnya.",img:"img/4.jpg",w:1366,h:2048,c:0,u:IG},
    {d:"",t:"Panggung Wayang dan Musik",s:"Barisan vokalis berbaju merah tampil bersama boneka wayang, diiringi biola dan alat tiup.",img:"img/9.jpg",w:960,h:640,c:0,u:IG},
    {d:"",t:"Gamelan Bertemu Terompet",s:"Pemain gamelan berudeng di depan, terompet dan saksofon mengiringi dari belakang.",img:"img/3.jpg",w:1366,h:2048,c:0,u:IG},
    {d:"",t:"Serba Putih di Panggung",s:"Kolase para pemain berbaju putih memainkan gamelan dan perkusi, berwarna maupun hitam putih.",img:"img/2.jpg",w:2160,h:2880,c:3,u:IG},
    {d:"",t:"Pentas dan Obrolan Panggung",s:"Kolase vokalis duduk bersila di antara gamelan (atas) dan sesi bincang-bincang bermikrofon di panggung (bawah).",img:"img/1.jpg",w:2160,h:2880,c:2,u:IG},
    {d:"",t:"Latihan di Atas Panggung",s:"Para personel berlatih dengan gitar bas, saksofon, biola, dan gamelan di gedung pertunjukan.",img:"img/7.jpg",w:890,h:594,c:0,u:IG},
    {d:"",t:"Membahas Partitur",s:"Tiga orang berdiskusi soal partitur saat latihan, salah satunya memegang gitar bas.",img:"img/6.jpg",w:1440,h:960,c:0,u:IG},
    {d:"",t:"Menyapa Penonton",s:"Vokalis bertopi menunjuk ke arah penonton, sementara sebagian penonton mengabadikannya dengan ponsel.",img:"img/8.jpg",w:638,h:424,c:0,u:IG}
  ];

  function $(id){return document.getElementById(id)}
  function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  var list=$("list");

  /* ---------- susunan masonry: tiap foto masuk ke kolom yang paling pendek ---------- */
  var nCols=0;
  function colCount(){return innerWidth>1000?3:2}
  function render(){
    var n=colCount();if(n===nCols)return;nCols=n;
    list.innerHTML="";
    var cols=[],hs=[];
    for(var i=0;i<n;i++){var c=document.createElement("div");c.className="col";list.appendChild(c);cols.push(c);hs.push(0)}
    MEDIA.forEach(function(m,i){
      var w=m.w||3,h=m.h||2,k=hs.indexOf(Math.min.apply(null,hs));
      var a=document.createElement("a");
      a.className="md";a.href=m.img;a.dataset.i=i;a.style.aspectRatio=w+"/"+h;
      a.setAttribute("aria-label","Lihat foto: "+m.t);
      a.innerHTML=(m.img?'<img src="'+esc(m.img)+'" alt="" loading="lazy" onerror="this.remove()">':'')+
        (m.c?'<span class="cnt">+'+m.c+'</span>':'')+
        '<span class="ex"><i class="fa-solid fa-expand"></i></span>'+
        '<span class="cap">'+(m.d?'<time>'+esc(m.d)+'</time>':'')+'<h2>'+esc(m.t)+'</h2></span>';
      cols[k].appendChild(a);hs[k]+=h/w;
    });
  }
  render();
  var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(render,150)});

  /* ---------- popup detail ---------- */
  var lb=$("lb"),img=$("lbImg"),cur=0,opener=null;
  function show(i){
    cur=(i+MEDIA.length)%MEDIA.length;var m=MEDIA[cur];
    img.classList.add("ld");
    img.onload=img.onerror=function(){img.classList.remove("ld")};
    img.src=m.img;img.alt=m.t;
    $("lbNo").textContent=("0"+(cur+1)).slice(-2)+" / "+("0"+MEDIA.length).slice(-2);
    var d=$("lbD");d.textContent=m.d||"";d.style.display=m.d?"block":"none";
    $("lbT").textContent=m.t;
    var p=$("lbP");p.textContent=m.s||"";p.style.display=m.s?"block":"none";
    var u=$("lbU");if(m.u){u.href=m.u;u.style.display=""}else u.style.display="none";
  }
  function open(i,el){opener=el||null;show(i);lb.classList.add("open");lb.setAttribute("aria-hidden","false");$("lbX").focus()}
  function close(){lb.classList.remove("open");lb.setAttribute("aria-hidden","true");if(opener)opener.focus()}
  list.addEventListener("click",function(e){
    var a=e.target.closest(".md");if(!a)return;
    e.preventDefault();open(+a.dataset.i,a);
  });
  $("lbX").onclick=close;
  $("lbPrev").onclick=function(){show(cur-1)};
  $("lbNext").onclick=function(){show(cur+1)};
  lb.addEventListener("click",function(e){if(e.target===lb)close()});
  addEventListener("keydown",function(e){
    if(!lb.classList.contains("open"))return;
    if(e.key==="Escape")close();
    else if(e.key==="ArrowLeft")show(cur-1);
    else if(e.key==="ArrowRight")show(cur+1);
    else if(e.key==="Tab"){ // fokus tetap di dalam popup
      var f=[$("lbX"),$("lbU"),$("lbPrev"),$("lbNext")].filter(function(x){return x.offsetParent!==null});
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
  });
  var tx=null;
  lb.addEventListener("touchstart",function(e){tx=e.touches[0].clientX},{passive:true});
  lb.addEventListener("touchend",function(e){
    if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;
    if(Math.abs(dx)>60)show(cur+(dx<0?1:-1));
  },{passive:true});
})();
</script>
</body>
</html>
