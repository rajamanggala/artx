<style>
:root{--black:#000;--red:#D62420;--white:#fff;--r:24px;--font:"Martian Mono",ui-monospace,Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--black);color:var(--white);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.vp{position:fixed;inset:0;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.stage{position:relative;width:100%;height:100%;border-radius:var(--r);background:radial-gradient(ellipse at 30% 70%,#4a0d0b,#000 65%)}
.stage>video,.stage>canvas,.shade{position:absolute;inset:0;width:100%;height:100%}
.stage>video{object-fit:cover}
.stage>video,.stage>canvas,.shade,.fogcss{border-radius:var(--r)}
.shade{background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,.1) 45%,rgba(0,0,0,.35))}
#fog{pointer-events:none}
.fogcss{display:none;position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fogcss i{position:absolute;width:80%;height:80%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 65%);filter:blur(40px);animation:drift 28s ease-in-out infinite alternate}
.fogcss i:nth-child(2){right:-20%;bottom:-20%;animation-duration:36s;background:radial-gradient(circle,rgba(214,36,32,.35),transparent 65%)}
@keyframes drift{from{transform:translate(-10%,-5%)}to{transform:translate(25%,15%)}}
.nogl #fog{display:none}.nogl .fogcss{display:block}
/* tab hitam yang menyatu dengan bingkai */
.tab{position:absolute;background:var(--black);z-index:5}
.tab::before,.tab::after{content:"";position:absolute;pointer-events:none}
/* lengkungan dibuat +1px & menumpuk ke tab supaya tidak ada garis tipis */
.tl{top:0;left:0;border-bottom-right-radius:var(--r);padding:12px 16px 16px 12px}
.tl::before{left:calc(100% - 1px);top:0;width:calc(var(--r) + 1px);height:var(--r)}
.tl::after{left:0;top:calc(100% - 1px);width:var(--r);height:calc(var(--r) + 1px)}
.tl::before,.tl::after{background:radial-gradient(circle at 100% 100%,transparent var(--r),var(--black) calc(var(--r) + .5px))}
.tr{top:0;right:0;border-bottom-left-radius:var(--r);padding:26px 32px 28px 36px}
.tr::before{right:calc(100% - 1px);top:0;width:calc(var(--r) + 1px);height:var(--r)}
.tr::after{right:0;top:calc(100% - 1px);width:var(--r);height:calc(var(--r) + 1px)}
.tr::before,.tr::after{background:radial-gradient(circle at 0 100%,transparent var(--r),var(--black) calc(var(--r) + .5px))}
.bl{bottom:0;left:0;border-top-right-radius:var(--r);padding:16px 18px 12px 14px;font-size:11px}
.bl::before{left:calc(100% - 1px);bottom:0;width:calc(var(--r) + 1px);height:var(--r)}
.bl::after{left:0;bottom:calc(100% - 1px);width:var(--r);height:calc(var(--r) + 1px)}
.bl::before,.bl::after{background:radial-gradient(circle at 100% 0,transparent var(--r),var(--black) calc(var(--r) + .5px))}
.br{bottom:0;right:0;border-top-left-radius:var(--r);padding:16px 18px 12px 24px;font-size:11px;display:flex;gap:18px}
.br::before{right:calc(100% - 1px);bottom:0;width:calc(var(--r) + 1px);height:var(--r)}
.br::after{right:0;bottom:calc(100% - 1px);width:var(--r);height:calc(var(--r) + 1px)}
.br::before,.br::after{background:radial-gradient(circle at 0 0,transparent var(--r),var(--black) calc(var(--r) + .5px))}
.br a:hover{color:var(--red)}
.br .cp{display:none}
.logo{display:block;width:84px;height:84px;object-fit:contain}
.menu{display:flex;gap:32px;margin:0;padding:0;list-style:none;font-size:16px;text-transform:uppercase}
.menu a{padding:6px 0;border-bottom:3px solid transparent;transition:border-color .2s}
.menu a:hover,.menu a[aria-current="page"]{border-color:var(--red)}
.burger{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:44px;height:44px;padding:0;background:none;border:0;cursor:pointer}
.burger span{display:block;width:26px;height:2px;background:var(--white);border-radius:2px}
.sheet{position:fixed;inset:0;z-index:30;background:var(--black);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 10vw;transform:translateX(-100%);visibility:hidden;transition:transform .55s cubic-bezier(.77,0,.18,1),visibility 0s linear .55s}
.sheet.open{transform:translateX(0);visibility:visible;transition:transform .55s cubic-bezier(.77,0,.18,1),visibility 0s}
.sheet a{font:700 clamp(28px,9vw,44px)/1.25 var(--font)}

.pill{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 22px;border-radius:99px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--white);font:400 12px var(--font);text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
.pill:hover{background:var(--white);color:var(--black)}

/* popup follow */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);transition:opacity .45s ease,backdrop-filter .45s ease,-webkit-backdrop-filter .45s ease,visibility 0s linear .45s}
.modal.open{opacity:1;visibility:visible;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .45s ease,backdrop-filter .45s ease,-webkit-backdrop-filter .45s ease,visibility 0s}
.modal-box{position:relative;width:min(460px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:#000;border:1px solid rgba(255,255,255,.14);border-top:3px solid var(--red);border-radius:var(--r);padding:40px 26px 28px;opacity:0;transform:translateY(28px) scale(.96);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .45s ease}

.modal-x{position:absolute;top:12px;right:12px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:none;color:var(--white);cursor:pointer;transition:background .25s,border-color .25s,transform .35s}

.row{opacity:0;transform:translateY(14px);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1),background .25s,color .25s,border-color .25s}
.modal.open .row{opacity:1;transform:none;transition-delay:calc(.15s + var(--i) * .06s),calc(.15s + var(--i) * .06s),0s,0s,0s}
.modal.open .row:hover{transition-delay:0s}
.link{display:flex;align-items:center;gap:14px;height:52px;padding:0 18px;border:1px solid rgba(255,255,255,.22);border-radius:14px;font-size:12px;text-transform:uppercase}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}

/* preloader */
.pre{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
.pre.done{opacity:0;visibility:hidden}
.pre-in{position:relative;width:clamp(220px,40vmin,340px);aspect-ratio:1;display:grid;place-items:center}
.pre-in img{width:60%;height:60%;object-fit:contain;animation:prePulse 3.2s cubic-bezier(.45,0,.55,1) infinite;will-change:transform,opacity}
.pre-in svg{position:absolute;width:100%;height:100%}
.pre-in .ring-a{inset:0;animation:preSpin 1.6s linear infinite}
.pre-in .ring-b{inset:9%;width:82%;height:82%;animation:preSpinRev 2.2s linear infinite}
.pre-in circle{fill:none;stroke-linecap:round}
.ring-a circle{stroke:var(--red);stroke-width:2.5;stroke-dasharray:110 192}
.ring-b circle{stroke:rgba(255,255,255,.85);stroke-width:2;stroke-dasharray:70 232}
@keyframes preSpin{to{transform:rotate(360deg)}}
@keyframes preSpinRev{to{transform:rotate(-360deg)}}
@keyframes prePulse{0%,100%{opacity:.7;transform:scale(.97)}50%{opacity:1;transform:scale(1.02)}}

@media(max-width:820px){

  .burger span{width:20px}
  .bl{font-size:9px;padding:14px 14px 10px 14px}
  .bl{display:none}
  .br{--r:16px;font-size:9px;padding:10px 12px 8px 16px;display:grid;grid-template-columns:auto auto;gap:2px 6px;justify-items:end}
  .br .cp{display:block;grid-column:1/-1}
  .cta{right:auto;left:50%;transform:translateX(-50%);top:auto;bottom:48px;gap:8px}
  .cta .pill{height:34px;padding:0 14px;font-size:10px}
  .logo{width:46px;height:46px}
  .card{bottom:92px;left:16px;width:min(320px,calc(100% - 32px))}
  .card .cover{width:64px;font-size:26px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
  var sheet=document.getElementById("sheet");
  document.getElementById("open").onclick=function(){sheet.classList.add("open")};
  document.getElementById("close").onclick=function(){sheet.classList.remove("open")};

  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var saver=navigator.connection&&navigator.connection.saveData;
  var vid=document.getElementById("bg");
  if(saver||reduce){vid.removeAttribute("autoplay");vid.pause();[].forEach.call(vid.querySelectorAll("source"),function(x){x.removeAttribute("src")});vid.load()}
  var srcs=vid.querySelectorAll("source");function hideVid(){vid.style.display="none"}
  srcs[srcs.length-1].addEventListener("error",hideVid);vid.addEventListener("error",hideVid);

  var cv=document.getElementById("fog"),stage=document.getElementById("stage");
  var gl=cv.getContext("webgl",{alpha:true,premultipliedAlpha:true,antialias:false});
  if(!gl){document.body.classList.add("nogl");return}

  /* Efek kaca berembun: embun + tetesan air. Kursor/jari mengelap kaca, embun muncul lagi perlahan. */
  var vs="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  var fs=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uV,uM;uniform vec2 uR,vs;uniform float t,uTex;
float h2(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
/* garis air panjang: kepala tetesan merayap turun, jalur bening berkelok di belakangnya.
   return: x = posisi melintang di dalam garis (-1..1), y = kekuatan jalur, z = kepala tetesan, w = arah normal kepala */
vec4 streak(vec2 q,float cols,float seed){
  float colw=1./cols;
  vec2 g=vec2(q.x*cols,0.);
  float id=floor(g.x);
  vec2 sid=vec2(id,seed);
  float a=h2(sid),b=h2(sid+3.7),c=h2(sid+8.1),s=h2(sid+13.3),bl=.6+.7*h2(sid+19.9);
  if(a>.72)return vec4(0.);
  float v=q.y/bl+c*7.;
  float sg=floor(v),vf=fract(v);
  vec2 gid=vec2(id+sg*31.7,seed+5.);
  if(h2(gid)>.8)return vec4(0.);
  float prog=fract(t*(.012+.02*s)+h2(gid+2.2));
  float hp=1.-prog;
  float fade=smoothstep(0.,.04,prog)*smoothstep(1.,.9,prog);
  float cx=(id+.5)*colw+(b-.5)*colw*.35+.0010*sin(q.y*7.+c*6.28);
  float w=(.0042+.0048*c);
  float dist=max(vf-hp,0.)*bl;
  float wd=w*mix(1.,.5,clamp(dist/.6,0.,1.));
  float dx=q.x-cx;
  float u=clamp(dx/wd,-1.,1.);
  float tm=smoothstep(1.,.7,abs(dx/wd))*step(hp,vf)*smoothstep(1.,.96,vf)*fade;
  float headY=(sg+hp-c*7.)*bl;
  vec2 hd=vec2(dx,(q.y-headY)*.75);
  float rh=w*1.7+.002;
  float head=smoothstep(rh,rh*.55,length(hd))*fade;
  return vec4(u*tm+hd.x/rh*head*.6,tm,head,0.);
}
/* bintik embun kecil */
vec3 beads(vec2 uv,float sc,float dens,float rmax){
  vec2 g=uv*sc,id=floor(g),f=fract(g)-.5;
  if(h2(id)>dens)return vec3(0.);
  vec2 o=(vec2(h2(id+3.3),h2(id+9.1))-.5)*.5;
  float s=h2(id+5.7),rad=rmax*(.12+.88*s*s*s);
  vec2 d=f-o;
  float body=smoothstep(rad,rad*.45,length(d));
  return vec3(d/rad*body*.8,body);
}
/* noise halus untuk bercak embun tebal-tipis */
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1.,0.)),f.x),mix(h2(i+vec2(0.,1.)),h2(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){return .5*n2(p)+.25*n2(p*2.1)+.125*n2(p*4.3)+.0625*n2(p*8.7);}
vec3 samp(vec2 u){return texture2D(uV,(u-.5)*vs+.5).rgb;}
void main(){
  vec2 uv=gl_FragCoord.xy/uR;float asp=uR.x/uR.y;vec2 q=vec2(uv.x*asp,uv.y);
  vec4 s1=streak(q,22.,1.),s2=streak(q+vec2(.021,0.),15.,9.),s3=streak(q+vec2(.013,0.),11.,17.);

  vec2 n=vec2(s1.x+s2.x+s3.x,0.)+b0.xy+b1.xy+b2.xy+b3.xy+b4.xy;

<script>
(function(){
  var pre=document.getElementById("pre"),vid=document.getElementById("bg");
  var start=performance.now(),MIN=800,MAX=2500,finished=false,pageOk=false,vidOk=false;
  var skipVid=true;

  function finish(){
    if(finished)return;finished=true;
    var wait=Math.max(0,MIN-(performance.now()-start));
    setTimeout(function(){
      pre.classList.add("done");
      document.body.classList.remove("loading");
      setTimeout(function(){pre.remove()},900);
    },wait);
  }
  function check(){if(pageOk&&vidOk)finish()}

  if(document.readyState==="complete")pageOk=true;
  else addEventListener("load",function(){pageOk=true;check()});

  if(skipVid||vid.readyState>=3)vidOk=true;
  else{
    ["canplay","loadeddata","error"].forEach(function(ev){
      vid.addEventListener(ev,function(){vidOk=true;check()});
    });
  }
  check();
  setTimeout(finish,MAX);
})();
</script>

<script>
(function(){
  var m=document.getElementById("modal"),openB=document.getElementById("openFollow"),closeB=document.getElementById("mClose"),lastFocus=null;
  function openM(){lastFocus=document.activeElement;m.classList.add("open");setTimeout(function(){closeB.focus()},60)}
  function closeM(){m.classList.remove("open");if(lastFocus)lastFocus.focus()}
  openB.addEventListener("click",openM);
  closeB.addEventListener("click",closeM);
  m.addEventListener("click",function(e){if(e.target===m)closeM()});
  addEventListener("keydown",function(e){if(e.key==="Escape"&&m.classList.contains("open"))closeM()});
})();
